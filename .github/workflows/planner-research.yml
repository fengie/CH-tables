name: Publish planner research snapshots

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/planner-research.yml"
      - "ch_tables/pet_catalog.py"
      - "ch_tables/skill_priorities.py"
      - "ch_tables/market_import.py"
      - "ch_tables/item_rarity.py"
      - "ch_tables/game_query.py"
      - "data/community/prices.csv"
      - "data/community/drops.csv"

permissions:
  contents: write

concurrency:
  group: ch-planner-research
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify modeling and ingestion tests
        run: |
          python -m unittest tests.test_build_planner tests.test_economy tests.test_market_import tests.test_pet_catalog tests.test_skill_priorities tests.test_personal_planner tests.test_companions tests.test_item_rarity -v
      - name: Index item name tiers separately from drop probability
        run: |
          python -m unittest tests.test_item_rarity -v
          python -m ch_tables.item_rarity --data data/game
      - name: Index source-backed companion gear and dated pet tiers
        run: python -m ch_tables.pet_catalog --data data/game --output data/pets
      - name: Rank the original saved-build skill observations
        run: python -m ch_tables.skill_priorities
      - name: Audit per-world price and RNG submissions
        run: python -m ch_tables.market_import --game data/game --input data/community --output data/community
      - name: Execute transparent synthetic personal scenario
        run: python -m ch_tables.personal_planner --scenario data/planner/example_scenario.json > data/planner/demo_report.json
      - name: Verify outputs are internally consistent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pets=json.loads(Path("data/pets/pets_and_tiers.json").read_text())
          rankings=json.loads(Path("data/planner/skill_snapshot_rankings.json").read_text())
          market=json.loads(Path("data/community/market_summary.json").read_text())
          assert pets["source_items"]==23752
          assert len(pets["public_pet_species"])>=8
          assert len(pets["measured_tiers"])>=18
          assert rankings["published_saved_builds"]>=8
          assert market["prices_submitted"]>=0
          rarity=json.loads(Path("data/game/item_rarity_summary.json").read_text())
          assert rarity["source_items"]==23752
          assert rarity["drop_chances_populated"]==0
          demo=json.loads(Path("data/planner/demo_report.json").read_text())
          assert demo["scenario_status"]=="synthetic_demo"
          assert demo["builds"]["point_budget"]==5
          assert len(demo["builds"]["results"])==4
          assert all("by_source_modeled_net_after_auto_loss" in x for x in rankings["builds"].values())
          print("PET SPECIES",len(pets["public_pet_species"]))
          print("PUBLISHED SKILL BUILDS",rankings["published_saved_builds"])
          print("REAL WORLD PRICES",market["prices_submitted"])
          PY
      - name: Publish only if no other agent advanced main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pets data/planner/skill_snapshot_rankings.json data/planner/demo_report.json data/community/market_summary.json data/game/item_rarity_summary.json data/game/item_rarity_metadata.jsonl.gz
          if git diff --cached --quiet; then
            echo "Evidence-based planner data unchanged"
            exit 0
          fi
          git commit -m "data: publish pet tiers, observed skill indices and economy evidence"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced; refusing stale research publication"
            exit 1
          fi
          git push origin HEAD:main
