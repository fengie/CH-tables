name: Refresh Celtic Heroes catalog

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/catalog-import.yml"
      - "ch_tables/catalog_ingest.py"

permissions:
  contents: write

concurrency:
  group: ch-catalog-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify local extraction tests before network I/O
        run: python -m unittest tests.test_catalog_ingest -v
      - name: Fetch pinned public JSON data safely
        run: python -m ch_tables.catalog_ingest --output data/catalog
      - name: Inspect manifest
        run: |
          python -c "import json; x=json.load(open('data/catalog/catalog_manifest.json')); print('selected=', x['selected_relevant_items'], 'total=',x['total_unique_items'], 'missing=',x['missing_terms'])"
      - name: Publish data only when canonical main has not moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "data: import source-pinned rogue item catalog"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main moved; refusing stale generated catalog publication"
            exit 1
          fi
          git push origin HEAD:main
