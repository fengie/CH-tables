name: README timestamp

on:
  pull_request:
    paths:
      - README.md
  push:
    branches:
      - main
    paths:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-timestamp-${{ github.repository }}
  cancel-in-progress: true

jobs:
  readme-timestamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Validate README timestamp on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          pattern='^> ⏱️ Last README update: `[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z` _\(auto-maintained\)_$'
          current="$(grep -m1 -E "$pattern" README.md || true)"
          if [[ -z "$current" ]]; then
            echo "::error::README.md must contain the auto-maintained README timestamp line."
            exit 1
          fi

          git fetch origin "${{ github.base_ref }}" --depth=1
          base="$(git show "origin/${{ github.base_ref }}:README.md" 2>/dev/null | grep -m1 -E "$pattern" || true)"
          if [[ "$current" == "$base" ]]; then
            echo "::error::README.md changed but its Last README update timestamp did not."
            exit 1
          fi

      - name: Stamp README on main
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          path = Path("README.md")
          if not path.exists():
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")
          stamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          replacement = f"> ⏱️ Last README update: `{stamp}` _(auto-maintained)_"
          pattern = re.compile(r"^> ⏱️ Last README update: `[^\n]+` _\(auto-maintained\)_$", re.MULTILINE)

          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
          else:
              lines = text.splitlines()
              insert_at = 1 if lines and lines[0].startswith("#") else 0
              lines[insert_at:insert_at] = ["", replacement]
              text = "\n".join(lines)
              if not text.endswith("\n"):
                  text += "\n"

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit refreshed timestamp
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README timestamp [skip readme-timestamp]"
          git push
